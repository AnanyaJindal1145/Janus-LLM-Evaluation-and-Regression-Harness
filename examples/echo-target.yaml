name: echo-baseline
promptVersion: "1"
modelId: echo
# {{input}} is filled per-case by the runner. The EchoModel returns the last
# non-blank line, so the rendered input lands there.
promptTemplate: |
  Answer the question concisely.
  {{input}}
params:
  temperature: 0.0
  maxTokens: 256
scorers:
  - EXACT_MATCH
  - CONTAINS
